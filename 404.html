<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<meta name="robots" content="noindex">
<title>Lost in space — Armaan Sidhu</title>
<link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center; padding: 24px; color: #edede9; text-align: center;
    font-family: 'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
    background-color: #04060c;
    background-image:
      radial-gradient(1.4px 1.4px at 24px 38px, rgba(255, 255, 255, 0.9), transparent),
      radial-gradient(1px 1px at 150px 96px, rgba(159, 225, 203, 0.85), transparent),
      radial-gradient(1px 1px at 92px 170px, rgba(189, 183, 246, 0.85), transparent),
      radial-gradient(1.6px 1.6px at 210px 230px, rgba(255, 255, 255, 0.75), transparent),
      radial-gradient(ellipse 80% 55% at 75% 8%, rgba(86, 70, 170, 0.3), transparent 70%),
      radial-gradient(ellipse 70% 50% at 8% 92%, rgba(29, 158, 117, 0.16), transparent 70%);
    background-size: 230px 230px, 310px 310px, 270px 270px, 390px 390px, 100% 100%, 100% 100%;
  }
  .code { font: 12px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.3em; color: #6fe0b2; margin-bottom: 18px; }
  h1 { font-size: clamp(34px, 9vw, 64px); line-height: 1; letter-spacing: -0.01em; margin-bottom: 16px; }
  p { color: #aeb9cd; font-size: 17px; line-height: 1.6; max-width: 26em; margin: 0 auto 30px; }
  a { display: inline-flex; align-items: center; min-height: 50px; padding: 0 26px; border-radius: 999px; color: #f4fffa; text-decoration: none;
      border: 1px solid rgba(111, 224, 178, 0.6); background: linear-gradient(135deg, rgba(111, 224, 178, 0.22), rgba(189, 183, 246, 0.16)); }
  a:hover, a:focus-visible { background: rgba(111, 224, 178, 0.18); outline: none; }
</style>
</head>
<body>
  <main>
    <p class="code" id="t-code">ERROR 404</p>
    <h1 id="t-h">This page drifted out of orbit.</h1>
    <p id="t-p">Whatever was here isn't anymore, or never was. The rest of the universe is right where you left it.</p>
    <a href="/" id="t-a">Take me home</a>
  </main>
  <script>
    // Same language as the visitor picked on the main page.
    (function () {
      var T = {
        fr: ['html:fr', 'Perdu dans l’espace — Armaan Sidhu', 'ERREUR 404', 'Cette page est sortie de son orbite.', 'Ce qui se trouvait ici n’y est plus, ou n’y a jamais été. Le reste de l’univers est exactement là où vous l’avez laissé.', 'Retour à l’accueil'],
        es: ['html:es', 'Perdido en el espacio — Armaan Sidhu', 'ERROR 404', 'Esta página se salió de su órbita.', 'Lo que había aquí ya no está, o nunca estuvo. El resto del universo sigue justo donde lo dejaste.', 'Volver al inicio'],
        zh: ['html:zh-Hans', '迷失在太空 — Armaan Sidhu', '错误 404', '这个页面偏离了轨道。', '这里的内容已经不在了，或者从未存在过。宇宙的其余部分，都还在你离开时的地方。', '返回首页']
      };
      var t;
      try { t = T[localStorage.getItem('site.lang')]; } catch (e) { t = null; }
      if (!t) return;
      document.documentElement.lang = t[0].slice(5);
      document.title = t[1];
      ['t-code', 't-h', 't-p', 't-a'].forEach(function (id, i) { document.getElementById(id).textContent = t[i + 2]; });
    })();
  </script>
</body>
</html>
